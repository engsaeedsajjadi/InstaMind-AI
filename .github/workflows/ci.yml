name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: instamind
          POSTGRES_PASSWORD: instamind
          POSTGRES_DB: instamind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U instamind"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        id: lint
        continue-on-error: true
        run: |
          set +e
          output="$(ruff check app tests 2>&1)"
          code=$?
          echo "$output"
          if [ "$code" -ne 0 ]; then
            number="$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')"
            if [ -n "$number" ]; then
              gh pr comment "$number" --body "Ruff failed: $output"
            fi
          fi
          exit "$code"

      - name: Types (mypy)
        run: mypy app || true   # advisory until the baseline is clean

      - name: Tests
        env:
          INSTAMIND_APP_ENV: test
          INSTAMIND_SECRET_KEY: ci-secret-key-not-for-production-use
          INSTAMIND_TOKEN_ENCRYPTION_KEY: ci-token-encryption-key
        run: |
          set +e
          output="$(pytest -q --cov=app --cov-report=term-missing 2>&1)"
          code=$?
          echo "$output"
          if [ "$code" -ne 0 ]; then
            body=$(python -c 'import json,os,sys; print(json.dumps({"title":"CI diagnostic: pytest failure","body":"Temporary diagnostic for run "+os.environ["GITHUB_RUN_ID"]+"\\n\\n```text\\n"+sys.stdin.read()+"\\n```"}))' <<< "$output")
            curl -fsSL -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/$GITHUB_REPOSITORY/issues -d "$body"
          fi
          exit "$code"

      - name: Migrations apply cleanly on Postgres
        env:
          INSTAMIND_APP_ENV: test
          INSTAMIND_SECRET_KEY: ci-secret-key-not-for-production-use
          INSTAMIND_TOKEN_ENCRYPTION_KEY: ci-token-encryption-key
          INSTAMIND_DATABASE_URL: postgresql+asyncpg://instamind:instamind@localhost:5432/instamind
        run: |
          pip install asyncpg
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  image:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          push: false
          tags: instamind/backend:ci


  frontend:
    name: Frontend — typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  frontend-image:
    name: Frontend Docker build
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          push: false
          tags: instamind/frontend:ci
