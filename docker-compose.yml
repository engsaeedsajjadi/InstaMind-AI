# InstaMind AI — local development stack.
#
#   cp .env.example .env && docker compose up --build
#
# Services: api, worker, beat, frontend, postgres, redis, minio, nginx.
# Everything binds to 127.0.0.1 by default so a dev machine is not exposed.

name: instamind

x-backend-env: &backend-env
  INSTAMIND_APP_ENV: development
  INSTAMIND_DEBUG: "true"
  INSTAMIND_LOG_JSON: "false"
  INSTAMIND_DATABASE_URL: postgresql+asyncpg://instamind:instamind@postgres:5432/instamind
  INSTAMIND_REDIS_URL: redis://redis:6379/0
  INSTAMIND_CELERY_BROKER_URL: redis://redis:6379/1
  INSTAMIND_CELERY_RESULT_BACKEND: redis://redis:6379/2
  INSTAMIND_STORAGE_BACKEND: s3
  INSTAMIND_S3_ENDPOINT_URL: http://minio:9000
  INSTAMIND_S3_BUCKET: instamind
  INSTAMIND_S3_ACCESS_KEY: instamind
  INSTAMIND_S3_SECRET_KEY: instamind-dev-secret
  INSTAMIND_S3_REGION: us-east-1
  # Secrets come from .env — never hard-coded here.
  INSTAMIND_SECRET_KEY: ${INSTAMIND_SECRET_KEY}
  INSTAMIND_TOKEN_ENCRYPTION_KEY: ${INSTAMIND_TOKEN_ENCRYPTION_KEY}
  INSTAMIND_META_APP_ID: ${META_APP_ID:-}
  INSTAMIND_META_APP_SECRET: ${META_APP_SECRET:-}
  INSTAMIND_META_INSTAGRAM_CLIENT_ID: ${META_IG_CLIENT_ID:-}
  INSTAMIND_META_INSTAGRAM_CLIENT_SECRET: ${META_IG_CLIENT_SECRET:-}
  INSTAMIND_META_FACEBOOK_CLIENT_ID: ${META_FB_CLIENT_ID:-}
  INSTAMIND_META_FACEBOOK_CLIENT_SECRET: ${META_FB_CLIENT_SECRET:-}
  INSTAMIND_META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  INSTAMIND_META_REDIRECT_URI_INSTAGRAM: ${PUBLIC_URL:-http://localhost}/api/v1/social-accounts/oauth/instagram/callback
  INSTAMIND_META_REDIRECT_URI_FACEBOOK: ${PUBLIC_URL:-http://localhost}/api/v1/social-accounts/oauth/facebook/callback
  INSTAMIND_PUBLIC_MEDIA_BASE_URL: ${PUBLIC_URL:-http://localhost}/media
  INSTAMIND_AI_PROVIDER: ${AI_PROVIDER:-null}
  INSTAMIND_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  INSTAMIND_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: instamind
      POSTGRES_PASSWORD: instamind
      POSTGRES_DB: instamind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instamind -d instamind"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: instamind
      MINIO_ROOT_PASSWORD: instamind-dev-secret
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket once, then exits.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 instamind instamind-dev-secret &&
      mc mb --ignore-existing local/instamind &&
      mc anonymous set none local/instamind &&
      echo 'bucket ready'
      "

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Migrations run before the server accepts traffic.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    volumes:
      - ./apps/backend:/srv/app
      - media_storage:/srv/app/storage
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ./apps/backend
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    depends_on:
      backend:
        condition: service_started
    command: celery -A app.worker.celery_app worker -Q publishing,default -l info --concurrency=4
    healthcheck:
      disable: true
    volumes:
      - ./apps/backend:/srv/app

  beat:
    build:
      context: ./apps/backend
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    depends_on:
      backend:
        condition: service_started
    command: celery -A app.worker.celery_app beat -l info
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./apps/frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  media_storage:




