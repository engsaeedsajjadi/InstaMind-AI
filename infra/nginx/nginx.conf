# InstaMind AI — reverse proxy (development).
#
# Routes /api and /webhooks to the backend, everything else to Next.js.
# In production put TLS termination in front of this and forward
# X-Forwarded-Proto so the app can emit HSTS correctly.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Meta must get a 200 within ~5s for webhooks; keep buffers small.
    client_max_body_size 300m;
    client_body_timeout 60s;
    proxy_read_timeout 120s;

    log_format main '$remote_addr - $remote_user [$time_iso8601] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream backend { server backend:8000; }
    upstream frontend { server frontend:3000; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # ---- API --------------------------------------------------------- #
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Trace ids survive the proxy in both directions.
            proxy_set_header X-Request-Id      $request_id;
        }

        location = /health/live  { proxy_pass http://backend; }
        location = /health/ready { proxy_pass http://backend; }
        location = /metrics      { proxy_pass http://backend; }

        # ---- OpenAPI docs (development only; drop this block in prod) ----- #
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # ---- Frontend ---------------------------------------------------- #
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
        }
    }
}
